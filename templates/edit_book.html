{% extends "base.html" %}
{% block title %}Edit Book | Library Management{% endblock %}
{% block content %}
<h1 class="h2 mb-3">Edit book</h1>
<div class="card form-card"><div class="card-body">
<form method="post">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="title">Title</label><input class="form-control" id="title" name="title" value="{{ book.title }}" required></div>
        <div class="col-md-6"><label class="form-label" for="author">Author</label><input class="form-control" id="author" name="author" value="{{ book.author }}" required></div>
        <div class="col-md-6"><label class="form-label" for="category">Category</label><input class="form-control" id="category" name="category" value="{{ book.category }}" required></div>
        <div class="col-md-6"><label class="form-label" for="isbn">ISBN</label><input class="form-control" id="isbn" name="isbn" value="{{ book.isbn }}" required></div>
        <div class="col-md-6"><label class="form-label" for="publisher">Publisher</label><input class="form-control" id="publisher" name="publisher" value="{{ book.publisher }}" required></div>
        <div class="col-md-6"><label class="form-label" for="quantity">Total quantity</label><input class="form-control" id="quantity" name="quantity" type="number" min="0" value="{{ request.form.get('quantity', book.quantity) }}" required><div class="form-text">Currently issued copies: {{ book.quantity - book.available_quantity }}.</div></div>
    </div>
    <div class="mt-4"><button class="btn btn-primary" type="submit">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('books') }}">Cancel</a></div>
</form>
</div></div>
{% endblock %}
