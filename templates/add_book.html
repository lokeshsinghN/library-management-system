{% extends "base.html" %}
{% block title %}Add Book | Library Management{% endblock %}
{% block content %}
<h1 class="h2 mb-3">Add book</h1>
<div class="card form-card"><div class="card-body">
<form method="post">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="title">Title</label><input class="form-control" id="title" name="title" value="{{ request.form.get('title', '') }}" required></div>
        <div class="col-md-6"><label class="form-label" for="author">Author</label><input class="form-control" id="author" name="author" value="{{ request.form.get('author', '') }}" required></div>
        <div class="col-md-6"><label class="form-label" for="category">Category</label><input class="form-control" id="category" name="category" value="{{ request.form.get('category', '') }}" required></div>
        <div class="col-md-6"><label class="form-label" for="isbn">ISBN</label><input class="form-control" id="isbn" name="isbn" value="{{ request.form.get('isbn', '') }}" required></div>
        <div class="col-md-6"><label class="form-label" for="publisher">Publisher</label><input class="form-control" id="publisher" name="publisher" value="{{ request.form.get('publisher', '') }}" required></div>
        <div class="col-md-6"><label class="form-label" for="quantity">Quantity</label><input class="form-control" id="quantity" name="quantity" type="number" min="0" value="{{ request.form.get('quantity', '1') }}" required></div>
    </div>
    <div class="mt-4"><button class="btn btn-primary" type="submit">Save book</button> <a class="btn btn-outline-secondary" href="{{ url_for('books') }}">Cancel</a></div>
</form>
</div></div>
{% endblock %}
